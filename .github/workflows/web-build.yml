name: Web build

# Builds the browser version and puts it online.
#
#   - push to main           -> build, then publish to the site
#   - press "Run workflow"   -> the same, from whichever branch you pick
#                               (it only publishes when run from main)
#
# The build is kept as a download named "web-game" either way: a zip with
# index.html at the top, which is what itch.io wants for an HTML game.
#
# PUBLISHING. The site is a second repository, TTIF_mac_attack, whose main
# branch IS the built game — GitHub Pages serves it at
# https://prettygoodsoftware1000.github.io/TTIF_mac_attack/. Keeping the
# build out of this repository keeps a few megabytes of changed wasm out of
# its history every time the game is touched.
#
# The publish step needs a key, because it writes to another repository. It
# is skipped, without failing, where there isn't one — see README.md for the
# two minutes of setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # KNI's font builder looks for FreeType as libfreetype6.so; Ubuntu
      # calls it libfreetype.so.6.
      - name: Point the font builder at FreeType
        run: sudo ln -sf /usr/lib/x86_64-linux-gnu/libfreetype.so.6 /usr/lib/x86_64-linux-gnu/libfreetype6.so

      - name: Build
        run: dotnet publish Web -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: web-game
          path: out/wwwroot

      - name: Publish to the site
        if: github.ref == 'refs/heads/main' && env.DEPLOY_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

          git clone --depth 1 git@github.com:PrettyGoodSoftware1000/TTIF_mac_attack.git site
          cd site

          # Out with the old build, in with the new. Everything but .git is
          # the build, so a renamed or deleted file does not linger.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../out/wwwroot/. .
          touch .nojekyll          # or Pages hides every _framework file

          cat > README.md <<'NOTE'
          # The Timeline Is — browser build

          Play: https://prettygoodsoftware1000.github.io/TTIF_mac_attack/

          Built game files only, written by a robot. Do not edit by hand: the
          next build overwrites everything here. The source, and the workflow
          that publishes this, live in PrettyGoodSoftware1000/TheTimelineIs.

          No saves, no replays, no editor: closing the tab starts over.
          NOTE
          echo "" >> README.md
          echo "Built from TheTimelineIs ${GITHUB_SHA}" >> README.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # a build that changed nothing is not worth a commit
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "Build from TheTimelineIs ${GITHUB_SHA:0:7}"
          git push
